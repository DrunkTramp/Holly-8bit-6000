[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holly-host"
version = "0.0.1"
description = "Keyboard-driven conversational Holly: LLM + TTS + the Holly-8bit-6000 animated face"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "holly-8bit-6000",          # the animation component; pip install -e ../Holly
    "sounddevice>=0.4.6",       # audio OUTPUT only. Never a microphone.
]

[project.optional-dependencies]
ui = ["pillow>=10"]   # Tk itself is stdlib, but needs the system package: sudo apt install python3-tk
piper = ["piper-tts>=1.2"]
omnivoice = ["omnivoice"]   # GPU clone backend; NOT on PyPI. Install the CUDA torch first:
                             #   uv pip install --python .venv/bin/python \
                             #       --index-url https://download.pytorch.org/whl/cu128 \
                             #       torch==2.8.0 torchaudio==2.8.0
                             # then: uv pip install -e vendor/OmniVoice   (see README)
llm = ["llama-cpp-python>=0.3"]   # GPU build: see README (CMAKE_ARGS with GGML_CUDA)
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["hollyhost"]
